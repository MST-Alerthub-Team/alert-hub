name: logger-service

on:
  pull_request:
    paths:
      - "services/logger-service/**"
      - "pom.xml"
      - ".github/workflows/logger-service.yml"
  push:
    branches: [main]
    paths:
      - "services/logger-service/**"
      - "pom.xml"
      - ".github/workflows/logger-service.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/logger-service

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_MONGODB_URI: mongodb://localhost:27017/logs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test
        run: bash ./mvnw -B verify
