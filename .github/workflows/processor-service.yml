# CI for processor-service. Copy this file for each service and replace "processor".
# Runs only when files of this service, the shared root pom.xml, or this workflow change.
# processor has NO database, so there is no Postgres service and no SPRING_DATASOURCE_* variables.
name: processor-service

on:
  pull_request:
    paths:
      - "services/processor-service/**"
      - "pom.xml"
      - ".github/workflows/processor-service.yml"
  push:
    branches: [main]
    paths:
      - "services/processor-service/**"
      - "pom.xml"
      - ".github/workflows/processor-service.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/processor-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify